[project]
name = "resumelens-ai"
version = "1.0.0"
description = "AI-powered resume analysis and job-fit platform."
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.4",
    "pypdf==6.16.2",
    "python-docx==1.2.0",
    "joblib==1.5.3",
    "pandas==2.3.3",
    "scikit-learn==1.8.0",
    "python-multipart==0.0.32",
]

[tool.fastapi]
entrypoint = "backend.app.main:app"

[tool.setuptools.packages.find]
include = ["backend*"]